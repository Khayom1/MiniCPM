### MiniCPM5 Tajik LoRA SFT configuration.
### Adjust paths and GPU settings on the training host before launch.

### model
model_name_or_path: openbmb/MiniCPM5-2B
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

### dataset
dataset: tajik_sft
dataset_dir: ./tajik-data
template: minicpm5
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: ./runs/minicpm5-tajik-lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true

### evaluation
val_size: 0.05
eval_strategy: steps
eval_steps: 200
per_device_eval_batch_size: 1
